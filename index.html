}

/* ================= lesson engine ================= */
let LS = null;
function genQ(id, d){
  if (d >= 4) return advQ(id, Math.min(5, d));
  const L = Math.max(0, Math.min(3, d)), q = GEN[id](L); q.lvl = L; return q;
}
function makeQ(id, d){
  for (let tries = 0; tries < 12; tries++){
    const q = genQ(id, d);
    q.skill = id; q.key = q.prompt + '|' + JSON.stringify(q.answer) + '|' + (q.visual || '').length;
    if (!LS || !LS.keys.has(q.key)) { if (LS) LS.keys.add(q.key); return q; }
  }
  return Object.assign(genQ(id, d), {skill:id});
}
function startLesson(id, o = {}){
  if (id && !o.skipLearn && !o.lvl && !sk(id).learned && sk(id).lvl === 0){ startLearn(id); return; }
  const N = id ? 6 : 8;
  LS = {id, mode:o.lvl ? 'challenge' : id ? 'lesson' : 'review', adv:o.lvl || 0, keys:new Set(), queue:[], i:0, firstRight:0, answered:0, combo:0, skips:0, wrongNow:0, hintLvl:0, usedHint:false, perSkill:{}, t0:Date.now(), fwRun:0, slow:adaptFlags().slow};
  if (id){
    const d = o.lvl || sk(id).lvl;
    for (let k = 0; k < N; k++) LS.queue.push(makeQ(id, o.lvl ? d : k < 2 ? d - 1 : d));
  } else {
    const pool = orderOf(curSub()).filter(x => sk(x).lvl >= 1);
    const weighted = pool.flatMap(x => { const r = recentRate(x); return Array(4 - sk(x).lvl + (r != null && r < .6 ? 3 : 0) + (daysSince((ST().by[x] || {}).t) >= 5 ? 1 : 0)).fill(x); });
    for (let k = 0; k < N; k++){ const s = pick(weighted); LS.queue.push(makeQ(s, sk(s).lvl - 1)); }
  }
  openLessonUI();
  showQ();
}
function progress(){
  const w = (LS.answered / LS.queue.length * 100) + '%', f = $('#pfill'), grew = f.style.width && f.style.width !== w && LS.answered > 0;
  f.style.width = w; $('#combo').innerHTML = LS.combo >= 2 ? `${icon('flame', 3)}${LS.combo}` : '';
  $('.pbar').classList.toggle('fire', LS.combo >= 3);
  if (grew){ fxAnim($('.pbar'), 'shine', 800); if (LS.combo >= 2) fxAnim($('#combo'), 'bump', 300); }
}

function showQ(demo){
  const q = LS.queue[LS.i];
  LS.wrongNow = 0; LS.hintLvl = 0; LS.usedHint = false; LS.sel = null; LS.num = ''; LS.order = [];
  q.t0 = Date.now(); q.idx = LS.i;
  $('#sheet').hidden = true;
  progress();
  const body = $('#lbody'); body.innerHTML = ''; body.scrollTop = 0;
  const wrap = el('div', 'q');
  const head = el('div', 'qhead', kibi('normal', {head:true, scale:4}));
  const pr = el('div', 'prompt'); const p = el('p'); if (q.promptHTML) p.innerHTML = q.promptHTML; else p.textContent = q.prompt;
  const sayB = el('button', 'say', icon('speaker', 3)); sayB.setAttribute('aria-label', 'Read the question aloud'); sayB.onclick = () => { q.audio = true; speak(q.say || q.prompt, q.lang); };
  pr.append(p, sayB); head.append(pr);
  const grid = el('div', 'qgrid' + (q.visual ? '' : ' solo'));
  const vis = el('div', 'qvis', q.visual || '');
  const ans = el('div', 'qans');
  grid.append(vis, ans);
  const hb = el('div', 'hintbox'); hb.id = 'hintbox'; hb.hidden = true;
  wrap.append(head, grid, hb);
  body.append(wrap);
  buildAnswer(q, ans);
  $('#hintBtn').disabled = false;
  if (LS.mode === 'test') wrap.prepend(el('div', 'modetag test', `${icon('star', 2)} LEVEL CHECK · no hints, just try your best`));
  else if (LS.mode === 'challenge') wrap.prepend(el('div', 'modetag adv', `${icon('bolt', 2)} ${LVNAME[LS.adv].toUpperCase()} CHALLENGE`));
  else if (LS.mode === 'learn' && !demo){ wrap.prepend(el('div', 'modetag', `${icon('bulb', 3)} LET’S DO IT TOGETHER (${LS.i} of 2)`)); showHint(true); }
  if (!demo && LS.mode !== 'test' && LS.mode !== 'learn' && q.helper && adaptFlags().earlyHelper){ vis.append(el('div', 'helper early', q.helper)); }
  updateCheck();
  if (!demo && LS.slow && LS.mode !== 'learn'){ LS.hold = true; updateCheck(); setTimeout(() => { if (LS && LS.queue[LS.i] === q){ LS.hold = false; updateCheck(); } }, 2500); }
}

function buildAnswer(q, box){
  if (q.kind === 'choice'){
    const ch = el('div', 'choices');
    q.options.forEach(o => {
      const b = el('button', 'choice' + (o.txt ? ' txt' : '') + (o.big ? ' big' : '') + (o.zh ? ' zh' : ''), o.html || '');
      if (!o.html) b.textContent = o.label;
      b.dataset.v = o.value; b.setAttribute('aria-pressed', 'false');
      if (o.html) b.setAttribute('aria-label', 'option');
      b.onclick = () => { if (b.classList.contains('no')) return; sfx.tap(); fxAnim(b, 'sel', 250); LS.sel = o.value; ch.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', x === b)); updateCheck(); };
      ch.append(b);
    });
    box.append(ch);
  } else if (q.kind === 'number'){
    const nb = el('div', 'numbox'); nb.id = 'numbox';
    const kp = el('div', 'keypad');
    [1,2,3,4,5,6,7,8,9,'del',0,'ok'].forEach(k => {
      if (k === 'ok'){ kp.append(el('span')); return; }
      const b = el('button', k === 'del' ? 'del' : '', k === 'del' ? '⌫' : String(k));
      b.setAttribute('aria-label', k === 'del' ? 'Delete' : String(k));
      b.onclick = () => key(k);
      kp.append(b);
    });
    box.append(nb, kp); drawNum();
  } else {
    const slots = el('div', 'slots'); slots.id = 'slots';
    const tiles = el('div', 'tiles'); tiles.id = 'tiles';
    q.tiles.forEach((t, i) => { const b = el('button', 'tile' + (q.longTiles ? ' long' : '') + (q.zhTiles ? ' zh' : ''), t); b.dataset.i = i; b.onclick = () => { if (b.classList.contains('used')) return; sfx.tap(); LS.order.push(i); drawOrder(); fxAnim($('#slots').children[LS.order.length - 1], 'sel', 250); }; tiles.append(b); });
    box.append(slots, tiles); drawOrder();
  }
}
function key(k){
  const q = LS && LS.queue[LS.i]; if (!q || LS.demo || q.kind !== 'number' || !$('#sheet').hidden) return;
  if (k === 'del') LS.num = LS.num.slice(0, -1);
  else if (LS.num.length < 3) LS.num = (LS.num === '0' ? '' : LS.num) + k;
  sfx.tap(); drawNum(); updateCheck(); fxAnim($('#numbox'), 'sel', 200);
}
function drawNum(){
  const q = LS.queue[LS.i], nb = $('#numbox'); if (!nb) return;
  nb.innerHTML = `${q.pre ? `<span class="u">${q.pre}</span>` : ''}${LS.num ? `<span>${LS.num}</span>` : '<span class="ph">?</span>'}${q.unit ? `<span class="u">${q.unit}</span>` : ''}`;
}
function drawOrder(){
  const q = LS.queue[LS.i], slots = $('#slots'), tiles = $('#tiles'); if (!slots) return;
  slots.innerHTML = '';
  for (let s = 0; s < q.tiles.length; s++){
    const ti = LS.order[s];
    const b = el('button', 'slot' + (ti != null ? ' full' : '') + (q.longTiles ? ' long' : '') + (q.zhTiles ? ' zh' : ''), ti != null ? q.tiles[ti] : '');
    if (ti != null) b.onclick = () => { LS.order.splice(s, 1); drawOrder(); };
    else b.disabled = true;
    slots.append(b);
  }
  tiles.querySelectorAll('.tile').forEach(t => t.classList.toggle('used', LS.order.includes(+t.dataset.i)));
  updateCheck();
}
function updateCheck(){
  if (LS.demo){ $('#checkBtn').disabled = false; return; }
  const q = LS.queue[LS.i];
  if (LS.hold){ $('#checkBtn').disabled = true; return; }
  const ready = q.kind === 'choice' ? LS.sel != null : q.kind === 'number' ? LS.num.length > 0 : LS.order.length === q.tiles.length;
  $('#checkBtn').disabled = !ready;
}
document.addEventListener('keydown', e => {
  if ($('#lesson').hidden) return;
  if (!$('#sheet').hidden){ if (e.key === 'Enter' && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#sheet'))){ e.preventDefault(); const b = $('#sheet .btn.primarykey'); if (b) b.click(); } return; }
  if (/^[0-9]$/.test(e.key)) key(+e.key);
  else if (e.key === 'Backspace') key('del');
  else if (e.key === 'Enter' && !$('#checkBtn').disabled) $('#checkBtn').click();
});

function showHint(fromWrong){
  const q = LS.queue[LS.i];
  const hb = $('#hintbox'); hb.hidden = false;
  const lvl = Math.min(LS.hintLvl, q.hints.length - 1);
  const ht = x => typeof x === 'string' ? x : x.h;
  hb.innerHTML = q.hints.slice(0, lvl + 1).map((h, i) => `<div class="ht"><span>${i === lvl ? icon('bulb', 3) : icon('check', 2, {W:'#4E9F2F'})}</span><div>${ht(h)}</div></div>`).join('');
  const raw = q.hints[lvl], helper = (typeof raw === 'object' && raw.helper) || (q.helper && lvl >= 1 ? q.helper : '');
  if (helper) hb.append(el('div', 'helper', helper));
  LS.hintLvl = Math.min(LS.hintLvl + 1, q.hints.length - 1);
  LS.usedHint = true;
  if (!fromWrong) hb.scrollIntoView({behavior: REDUCE ? 'auto' : 'smooth', block:'nearest'});
  return {html:ht(raw), say:(q.hintSay && q.hintSay[lvl]) || ht(raw)};
}
$('#hintBtn').onclick = () => { sfx.tap(); { const q0 = LS.queue[LS.i]; if (!q0.tries && !q0.usedHint) q0.hintBefore = true; q0.usedHint = true; } const h = showHint(false); const q = LS.queue[LS.i]; speak(h.say, q.lang); };

function check(){
  const q = LS.queue[LS.i];
  let ok;
  if (q.kind === 'choice') ok = String(LS.sel) === String(q.answer);
  else if (q.kind === 'number') ok = parseInt(LS.num, 10) === q.answer;
  else ok = LS.order.map(i => q.tiles[i]).join('|') === q.answer.join('|');
  q.tries = (q.tries || 0) + 1;
  if (q.firstMs == null){ q.firstMs = Date.now() - q.t0; if (!ok && q.firstMs < 4000){ q.fastWrong = true; LS.fwRun++; } else if (ok) LS.fwRun = 0; }
  if (!ok) q.wrongs = (q.wrongs || 0) + 1;
  if (LS.mode === 'test'){
    if (q.kind === 'choice') document.querySelectorAll('.choice').forEach(b => { if (b.dataset.v === String(LS.sel)) b.classList.add(ok ? 'yes' : 'no'); });
    if (q.kind === 'number' && ok) $('#numbox').classList.add('yes');
    fxAnswer(q, ok, false);
    rec(q, ok, false); LS.answered++; testAnswer(ok); return;
  }
  if (ok){
    const first = LS.wrongNow === 0 && !LS.usedHint;
    if (first){ LS.firstRight++; LS.combo++; } else { LS.combo = 0; LS.grit = (LS.grit || 0) + 1; }
    q.usedHint = q.usedHint || LS.usedHint; rec(q, first, false);
    LS.answered++;
    (LS.perSkill[q.skill] = LS.perSkill[q.skill] || {r:0, n:0}).n++; if (first) LS.perSkill[q.skill].r++;
    if (q.kind === 'choice') document.querySelectorAll('.choice').forEach(b => { if (b.dataset.v === String(q.answer)) b.classList.add('yes'); });
    if (q.kind === 'number') $('#numbox').classList.add('yes');
    sfx.good2(first ? LS.combo - 1 : 0); progress(); fxAnswer(q, true, first);
    const praise = q.lang === 'zh' ? (first ? pick(['太棒了！', '答对了！', '真厉害！', '好极了！']) : pick(['你想出来了！', '不放弃，真棒！', '对了！'])) : first ? pick(['Great job!', 'Awesome!', 'You got it!', 'Super!', 'Brilliant!', 'Nice thinking!']) : pick(['You worked it out!', 'Well done for not giving up!', 'Yes! Good thinking!']);
    sheet('good', praise + (LS.combo >= 3 ? ` ${LS.combo} in a row!` : ''), q.explain, [['CONTINUE', 'go primarykey', next]]);
  } else {
    LS.wrongNow++; LS.combo = 0; sfx.think();
    if (q.kind === 'choice') document.querySelectorAll('.choice').forEach(b => { if (b.dataset.v === String(LS.sel)) { b.classList.add('no'); b.setAttribute('aria-pressed', 'false'); b.disabled = true; } });
    fxAnswer(q, false);
    LS.sel = null; LS.num = ''; LS.order = [];
    if (q.kind === 'number') drawNum(); if (q.kind === 'order') drawOrder();
    if (LS.fwRun >= 2 && !LS.slow && LS.mode !== 'learn'){
      LS.slow = true; LS.fwRun = 0;
      sheet('think', 'Whoa, slow down!', 'Kibi thinks you are going a bit fast. Read the question again, look carefully, then answer. Careful thinking wins stars!', [['OKAY!', 'warm primarykey', () => { $('#sheet').hidden = true; $('#lfoot').hidden = false; updateCheck(); }]]);
      speak('Whoa, slow down! Read the question again, look carefully, then answer.', 'en');
      return;
    }
    const hint = showHint(true); q.usedHint = true;
    const btns = [['TRY AGAIN', 'warm primarykey', () => { $('#sheet').hidden = true; $('#lfoot').hidden = false; updateCheck(); }]];
    if (LS.wrongNow >= 2 && LS.skips < 2) btns.push(['Skip for now', 'ghost', skip]);
    sheet('think', q.lang === 'zh' ? pick(['再想一想！', '没关系，看看提示！', '差一点点！']) : pick(['Not yet! Let’s think.', 'Good try! Here’s a clue.', 'Almost! Let’s look again.']), hint.html, btns);
    speak(hint.say, q.lang);
  }
}
$('#checkBtn').onclick = () => { if ($('#checkBtn').disabled) return; if (LS.demo) demoStep(); else check(); };
function skip(){
  const q = LS.queue[LS.i]; LS.skips++; rec(q, false, true);
  LS.queue.push(makeQ(q.skill, LS.mode === 'challenge' ? LS.adv : LS.mode === 'learn' ? 0 : sk(q.skill).lvl - 1));
  LS.queue.splice(LS.i, 1);
  $('#lfoot').hidden = false;
  if (LS.i >= LS.queue.length) (LS.mode === 'learn' ? finishLearn : finish)(); else showQ();
}
function sheet(kind, title, text, buttons){
  const s = $('#sheet'); s.className = 'sheet ' + kind; s.hidden = false;
  $('#lfoot').hidden = true;
  const inner = el('div', 'sheet-in');
  inner.append(el('h3', '', kibi(kind === 'good' ? 'happy' : 'think', {head:true, scale:3}) + `<span>${title}</span>`), el('p', '', text));
  const row = el('div', 'row');
  buttons.forEach(([label, cls, fn]) => { const b = el('button', 'btn ' + cls, label); b.onclick = fn; row.append(b); });
  inner.append(row);
  s.innerHTML = ''; s.append(inner);
}
function next(){
  $('#sheet').hidden = true; $('#lfoot').hidden = false;
  LS.i++;
  if (LS.i >= LS.queue.length) (LS.mode === 'learn' ? finishLearn : finish)(); else showQ();
}
function finish(){
  const total = LS.queue.length, fr = LS.firstRight;
  const wasOpen = new Set(ALLSK().filter(unlocked)), lvlB = LS.id ? sk(LS.id).lvl : 0, advB = LS.id ? (sk(LS.id).adv || 0) : 0, streakB = S.streak.last;
  let xp = 10 + fr * 2 + (fr === total ? 5 : 0);
  let msg = '';
  const lines = [['Lesson finished', 10]];
  if (LS.grit) lines.push([`Never gave up × ${LS.grit}`, Math.min(15, LS.grit * 5)]);
  if (LS.mode === 'challenge'){
    const s = sk(LS.id), need = LVNAME[LS.adv], pass = fr >= total - 1, lv = LS.adv - 3;
    if (pass && (s.adv || 0) < lv){ s.adv = lv; lines.push([`${need} badge`, LS.adv === 5 ? 50 : 30]); msg = `${badgeHTML(lv)}<br>You passed the ${need} challenge for ${SK[LS.id].name}!${lv === 1 ? '<br>The P2 Preview challenge is now open.' : ''}`; }
    else if (pass) msg = `Great work! You passed ${need} again.`;
    else msg = `Challenges are meant to be hard! Get ${total - 1} or more right on the first try to win the ${need} badge.`;
  } else if (LS.id){
    const s = sk(LS.id); s.lessons++; s.first += fr; s.tries += total;
    const before = s.lvl, u = unitOf(LS.id);
    const unitWas = u.skills.every(x => sk(x).lvl >= 3);
    if (s.lvl === 0) s.lvl = 1;
    else if (s.lvl < 3 && fr >= total - 1) s.lvl++;
    if (s.lvl > before){
      msg = s.lvl === 3 ? `${starHTML(3)}<br>You mastered ${SK[LS.id].name}!` : `${starHTML(s.lvl)}<br>New star! ${SK[LS.id].name} is now ${s.lvl} of 3 stars.`;
      lines.push(['New star', 10]);
      if (!unitWas && u.skills.every(x => sk(x).lvl >= 3)) lines.push([`Unit mastered: ${u.title}`, 100]);
    }
    else if (s.lvl < 3) msg = `Get ${total - 1} or more right on the first try to earn the next star. You can do it!`;
    else msg = 'Great practice! Keep it strong.';
  } else msg = 'Mixed review done. Your brain is getting stronger!';
  S.xp += xp;
  if (S.day.date !== today()) S.day = {date:today(), xp:0};
  S.day.xp += xp;
  let goalNow = false;
  if (S.day.xp >= GOAL && S.goalDay !== today()){ S.goalDay = today(); goalNow = true; lines.push(['Today’s goal reached', 10]); }
  if (S.streak.last !== today()){
    S.streak.n = S.streak.last === yesterday() ? S.streak.n + 1 : 1; S.streak.last = today();
    if (S.streak.n % 7 === 0) lines.push([`${S.streak.n}-day streak`, 50]);
    else if (S.streak.n === 3) lines.push(['3-day streak', 20]);
  }
  const earned = lines.reduce((t, l) => t + l[1], 0);
  S.coins = (S.coins || 0) + earned;
  logCoins(earned, LS.mode === 'challenge' ? `${LVNAME[LS.adv]}: ${SK[LS.id].name}` : LS.id ? `Lesson: ${SK[LS.id].name}` : 'Mixed review');
  logSession();
  save();
  const lvlA = LS.id ? sk(LS.id).lvl : 0, advA = LS.id ? (sk(LS.id).adv || 0) : 0, unitL = lines.find(l => /^Unit mastered/.test(l[0]));
  FX.pending = {coins:earned, streak:streakB !== today(), goal:goalNow, star:lvlA > lvlB ? LS.id : null, unlock:ALLSK().find(id => unlocked(id) && !wasOpen.has(id)) || null};
  sfx.win(); confetti();
  $('#lfoot').hidden = true; $('#sheet').hidden = true;
  $('#pfill').style.width = '100%'; $('#combo').textContent = '';
  const body = $('#lbody'); body.innerHTML = '';
  const perfect = fr === total;
  const r = el('div', 'result', `${kibi('wow', {scale:5})}<h2>${perfect ? 'Perfect lesson!' : LS.mode === 'challenge' ? 'Challenge done!' : 'Lesson complete!'}</h2>
    <div class="tiles3"><div class="rt a"><b>XP</b><span>${icon('bolt', 3)}<em class="cu" data-to="${xp}" data-pre="+">+${xp}</em></span></div><div class="rt b"><b>First try</b><span><em class="cu" data-to="${fr}" data-post="/${total}">${fr}/${total}</em></span></div><div class="rt c"><b>Streak</b><span>${icon('flame', 3)}${S.streak.n}</span></div></div>
    <div class="coinlines">${lines.map(l => `<div><span>${l[0]}</span><span>+${l[1]}</span></div>`).join('')}<div class="tot"><span>${icon('kcoin', 3)} K币 earned</span><span class="cu">+${earned}</span></div></div>
    <div class="lvlup">${msg}${goalNow ? '<br>Today’s goal reached!' : ''}</div>${breakNote()}`);
  const b = el('button', 'btn go wide', 'CONTINUE'); b.onclick = endLesson;
  r.append(b); body.append(r);
  resultFX(r, {earned, perfect, newStar:lvlA > lvlB && LS.mode !== 'challenge' ? lvlA : 0, badge:advA > advB, unit:unitL ? unitL[0].replace('Unit mastered: ', '') : ''});
}
function endLesson(){
  LS = null; $('#lesson').hidden = true; document.body.style.overflow = '';
  try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  if (view !== 'home' && (FX.pending.coins || FX.pending.unlock)) show('home'); else render();
  setTimeout(playPending, 120);
}
$('#quitBtn').onclick = () => {
  if (!LS || LS.i >= LS.queue.length){ endLesson(); return; }
  openModal(`<h3>Leave this lesson?</h3><div class="sub">Your answers in this lesson will not be saved.</div><div class="acts"><button class="btn go" data-close>KEEP GOING</button><button class="btn ghost" id="leaveBtn">Leave</button></div>`, c => {
    c.querySelector('#leaveBtn').onclick = () => { closeModal(); endLesson(); };
  });
};
function confetti(){
  if (REDUCE) return;
  const c = el('div', 'confetti');
  const cols = ['#2F6FDE', '#1E9E5A', '#E0503A', '#F6C23E', '#8A5CD6', '#0E8F9A'];
  for (let i = 0; i < 70; i++){ const p = el('i'); p.style.left = Math.random() * 100 + 'vw'; p.style.background = pick(cols); p.style.width = p.style.height = (8 + Math.floor(Math.random() * 3) * 4) + 'px'; p.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; p.style.animationDelay = (Math.random() * .4) + 's'; c.append(p); }
  document.body.append(c); setTimeout(() => c.remove(), 3800);
}

/* expose for testing */
window.__P1 = {GEN, ORDER, SK, advQ, ADV}; window.__T = {startLesson, startLearn, startTest, nodeSheet, endLesson, show, rec, makeQ, save, key, updateCheck, UNITS, get LS(){ return LS; }, set LS(v){ LS = v; }, get S(){ return S; }};

render();
setTimeout(connectRemote, 0);
